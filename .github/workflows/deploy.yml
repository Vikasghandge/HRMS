name: Deploy HRMS Application with Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: docker.io

jobs:
  # JOB 1: SonarQube Code Quality Analysis
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

  # JOB 2: Build, Scan, and Push
  build-and-secure:
    name: Build, Scan and Push Images
    needs: sonarqube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- BACKEND SERVICE ---
      - name: Build Backend Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/hrms-backend:${{ env.IMAGE_TAG }} ./backend

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/hrms-backend:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'HIGH,CRITICAL'

      # --- FRONTEND SERVICE ---
      - name: Build Frontend Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ env.IMAGE_TAG }} ./frontend

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'HIGH,CRITICAL'

      # --- FILE UPLOAD SERVICE ---
      - name: Build File Upload Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/hrms-file-upload:${{ env.IMAGE_TAG }} ./file-upload-service

      - name: Trivy Scan File Upload
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/hrms-file-upload:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-file-upload.sarif'
          severity: 'HIGH,CRITICAL'

      # --- NOTIFICATION SERVICE ---
      - name: Build Notification Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/hrms-notification:${{ env.IMAGE_TAG }} ./notification-service

      - name: Trivy Scan Notification
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/hrms-notification:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-notification.sarif'
          severity: 'HIGH,CRITICAL'

      # --- QR CODE SERVICE ---
      - name: Build QR Service Image
        run: docker build -t ${{ env.DOCKER_USERNAME }}/hrms-qr:${{ env.IMAGE_TAG }} ./qr-service

      - name: Trivy Scan QR Service
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/hrms-qr:${{ env.IMAGE_TAG }}'
          format: 'sarif'
          output: 'trivy-qr.sarif'
          severity: 'HIGH,CRITICAL'

      # --- PUSH IMAGES ---
      - name: Push All Images to Docker Hub
        run: |
          docker tag ${{ env.DOCKER_USERNAME }}/hrms-backend:${{ env.IMAGE_TAG }} ${{ env.DOCKER_USERNAME }}/hrms-backend:latest
          docker tag ${{ env.DOCKER_USERNAME }}/hrms-frontend:${{ env.IMAGE_TAG }} ${{ env.DOCKER_USERNAME }}/hrms-frontend:latest
          docker tag ${{ env.DOCKER_USERNAME }}/hrms-file-upload:${{ env.IMAGE_TAG }} ${{ env.DOCKER_USERNAME }}/hrms-file-upload:latest
          docker tag ${{ env.DOCKER_USERNAME }}/hrms-notification:${{ env.IMAGE_TAG }} ${{ env.DOCKER_USERNAME }}/hrms-notification:latest
          docker tag ${{ env.DOCKER_USERNAME }}/hrms-qr:${{ env.IMAGE_TAG }} ${{ env.DOCKER_USERNAME }}/hrms-qr:latest

          docker push ${{ env.DOCKER_USERNAME }}/hrms-backend --all-tags
          docker push ${{ env.DOCKER_USERNAME }}/hrms-frontend --all-tags
          docker push ${{ env.DOCKER_USERNAME }}/hrms-file-upload --all-tags
          docker push ${{ env.DOCKER_USERNAME }}/hrms-notification --all-tags
          docker push ${{ env.DOCKER_USERNAME }}/hrms-qr --all-tags

  # JOB 3: Deploy to Server
  deploy:
    name: Deploy to Production Server
    needs: build-and-secure
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/HRMS || exit 1
            docker compose pull
            docker compose down
            docker compose up -d
            docker image prune -af

  # JOB 4: Notify on Completion
  notify:
    name: Send Notification
    needs: [sonarqube, build-and-secure, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Deployment Status
        run: |
          echo "════════════════════════════════════════"
          echo "  HRMS Application Deployment Summary"
          echo "════════════════════════════════════════"
          echo "SonarQube: ${{ needs.sonarqube.result }}"
          echo "Security Scan & Build: ${{ needs.build-and-secure.result }}"
          echo "Deployment: ${{ needs.deploy.result }}"
          echo "════════════════════════════════════════"
