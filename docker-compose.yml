#version: '3.8'

services:
  # Backend Service
  backend:
    image: ${DOCKER_USERNAME}/hrms-backend:latest
    container_name: hrms-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=hrms_db
      - DB_USER=root
      - DB_PASSWORD=root123
      - JWT_SECRET=hrms_super_secret_key_2026
      - JWT_EXPIRES_IN=7d
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - hrms-network

  # Frontend Service
  frontend:
    image: ${DOCKER_USERNAME}/hrms-frontend:latest
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - hrms-network

  # File Upload Service
  file-upload-service:
    image: ${DOCKER_USERNAME}/hrms-file-upload:latest
    container_name: hrms-file-upload
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=hrms_db
      - DB_USER=root
      - DB_PASSWORD=root123
      - UPLOAD_DIR=/uploads
    volumes:
      - ./uploads:/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hrms-network

  # Notification Service
  notification-service:
    image: ${DOCKER_USERNAME}/hrms-notification:latest
    container_name: hrms-notification
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=hrms_db
      - DB_USER=root
      - DB_PASSWORD=root123
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USER=your-email@gmail.com
      - EMAIL_PASS=your-app-password
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - hrms-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: hrms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hrms_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/hrms_complete_backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hrms-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrms-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hrms-network

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  hrms-network:
    driver: bridge
