version: '3.8'

services:
  # Backend Service
  backend:
    image: ${DOCKER_USERNAME}/hrms-backend:latest
    container_name: hrms-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=hrms
      - DB_USER=postgres
      - DB_PASSWORD=your-password
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - database
      - rabbitmq
    networks:
      - hrms-network

  # Frontend Service
  frontend:
    image: ${DOCKER_USERNAME}/hrms-frontend:latest
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - hrms-network

  # File Upload Service
  file-upload-service:
    image: ${DOCKER_USERNAME}/hrms-file-upload:latest
    container_name: hrms-file-upload
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - UPLOAD_DIR=/uploads
    volumes:
      - ./uploads:/uploads
    depends_on:
      - database
    networks:
      - hrms-network

  # Notification Service
  notification-service:
    image: ${DOCKER_USERNAME}/hrms-notification:latest
    container_name: hrms-notification
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USER=your-email@gmail.com
      - EMAIL_PASS=your-app-password
    depends_on:
      - database
      - rabbitmq
    networks:
      - hrms-network

  # Database
  database:
    image: postgres:14-alpine
    container_name: hrms-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=hrms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=your-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - hrms-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrms-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - hrms-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  hrms-network:
    driver: bridge
