server {
listen 80;
server_name ghandge-hrms.duckdns.org;

```
root /usr/share/nginx/html;
index index.html;

# Serve React app
location / {
    try_files $uri $uri/ /index.html;
}

# ✅ Backend (FIXED: use Docker container name)
location /api/ {
    proxy_pass http://hrms-backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ✅ File upload service (FIXED)
location /api/files/ {
    proxy_pass http://hrms-file-upload:5002/api/files/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    client_max_body_size 10M;
}

# ✅ QR service (FIXED)
location /api/qr/ {
    proxy_pass http://hrms-qr:5003/api/qr/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

error_page 404 /index.html;
