apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ghandgevikas/hrms-notification:1
        ports:
        - containerPort: 5003
